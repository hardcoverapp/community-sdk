# The signed-in user's library. user_id comes from Me; Hasura row permissions
# already restrict what a token can see, but filtering by user keeps the
# query meaning explicit.
#
# Hasura rejects `_in: null`, so optional list filters need a default rather
# than being omitted. statusIds defaults to every UserBookStatus.

query GetLibrary(
  $userId: Int!
  $statusIds: [Int!] = [1, 2, 3, 4, 5, 6]
  $limit: Int = 25
  $offset: Int = 0
  $orderBy: [user_books_order_by!] = [{ updated_at: desc_nulls_last }]
) {
  user_books(
    where: { user_id: { _eq: $userId }, status_id: { _in: $statusIds } }
    order_by: $orderBy
    limit: $limit
    offset: $offset
  ) {
    ...UserBook
    book {
      ...BookSummary
    }
    edition {
      ...EditionSummary
    }
  }
}

query CountLibrary($userId: Int!, $statusIds: [Int!] = [1, 2, 3, 4, 5, 6]) {
  user_books_aggregate(where: { user_id: { _eq: $userId }, status_id: { _in: $statusIds } }) {
    aggregate {
      count
    }
  }
}

query GetUserBookForBook($userId: Int!, $bookId: Int!) {
  user_books(where: { user_id: { _eq: $userId }, book_id: { _eq: $bookId } }, limit: 1) {
    ...UserBookFull
    edition {
      ...EditionSummary
    }
  }
}

query GetUserBook($id: Int!) {
  user_books_by_pk(id: $id) {
    ...UserBookFull
    book {
      ...BookSummary
    }
    edition {
      ...EditionSummary
    }
  }
}

# Incremental sync: entries changed after a cursor, oldest change first. The
# cursor is the (updated_at, id) of the last row seen, so a page boundary inside
# a run of equal timestamps neither skips nor repeats rows. A first sync uses
# the defaults. updated_at is nullable in the schema but set on every row
# (checked against the staging dump, 2026-10-07). Changes to a read touch its
# entry (UserBookRead belongs_to :user_book, touch: true).
query GetLibraryChanges(
  $userId: Int!
  $after: timestamptz = "1970-01-01T00:00:00Z"
  $afterId: Int = 0
  $limit: Int = 25
) {
  user_books(
    where: {
      user_id: { _eq: $userId }
      _or: [{ updated_at: { _gt: $after } }, { updated_at: { _eq: $after }, id: { _gt: $afterId } }]
    }
    order_by: [{ updated_at: asc }, { id: asc }]
    limit: $limit
  ) {
    ...UserBook
    book {
      ...BookSummary
    }
    edition {
      ...EditionSummary
    }
  }
}

# Every entry id, to find removals: entries are deleted outright, and the API
# has no deletion feed (spec/06).
query GetLibraryIds($userId: Int!) {
  user_books(where: { user_id: { _eq: $userId } }) {
    id
  }
}

# Reads finished in a date range (inclusive), newest first, with their book:
# what stats and year-in-review screens need, without walking the library.
query GetFinishedReads($userId: Int!, $from: date!, $to: date!, $limit: Int = 25, $offset: Int = 0) {
  user_book_reads(
    where: { user_book: { user_id: { _eq: $userId } }, finished_at: { _gte: $from, _lte: $to } }
    order_by: [{ finished_at: desc }, { id: desc }]
    limit: $limit
    offset: $offset
  ) {
    ...UserBookRead
    user_book {
      id
      book_id
      rating
      book {
        ...BookSummary
      }
    }
  }
}

# The reader's "Owned" list (slug "owned"), which edition_owned adds to.
# Empty when they haven't marked anything owned yet.
query GetOwnedBooks($userId: Int!, $limit: Int = 25, $offset: Int = 0) {
  lists(where: { user_id: { _eq: $userId }, slug: { _eq: "owned" } }, limit: 1) {
    id
    list_books(order_by: [{ date_added: desc }, { id: desc }], limit: $limit, offset: $offset) {
      ...ListBook
      book {
        ...BookSummary
      }
      edition {
        ...EditionSummary
      }
    }
  }
}
