query GetBook($id: Int!) {
  books_by_pk(id: $id) {
    ...BookDetail
  }
}

query GetBookBySlug($slug: String!) {
  books(where: { slug: { _eq: $slug } }, limit: 1) {
    ...BookDetail
  }
}

query GetBooks($ids: [Int!]!) {
  books(where: { id: { _in: $ids } }) {
    ...BookSummary
  }
}

query GetEditionsForBook($bookId: Int!, $limit: Int = 25, $offset: Int = 0) {
  editions(
    where: { book_id: { _eq: $bookId } }
    order_by: { users_count: desc }
    limit: $limit
    offset: $offset
  ) {
    ...EditionSummary
  }
}

# Exact ISBN match. Several editions can share an ISBN (duplicate catalog
# records); most readers first makes the choice deterministic.
query FindEditionsByIsbn($isbns: [String!]!) {
  editions(
    where: { _or: [{ isbn_13: { _in: $isbns } }, { isbn_10: { _in: $isbns } }] }
    order_by: { users_count: desc }
  ) {
    ...EditionSummary
    book {
      ...BookSummary
    }
  }
}

# Returns ids only; resolve with GetBooks.
query TrendingBookIds($duration: TrendingDuration = month, $limit: Int = 25, $offset: Int = 0) {
  books_trending(duration: $duration, limit: $limit, offset: $offset) {
    ids
    error
  }
}

# Books first released in a date range (inclusive), most readers first.
# Matches the site's release calendar: active books only, by the book's own
# release date, so a reissue or translation of an older book isn't "new".
query ReleasedBooks($from: date!, $to: date!, $limit: Int = 25, $offset: Int = 0) {
  books(
    where: { release_date: { _gte: $from, _lte: $to }, book_status_id: { _eq: 1 } }
    order_by: [{ users_count: desc }, { id: asc }]
    limit: $limit
    offset: $offset
  ) {
    ...BookSummary
  }
}


query GetEdition($id: Int!) {
  editions_by_pk(id: $id) {
    ...EditionSummary
    book {
      ...BookSummary
    }
  }
}

# Books other services know by these ids (Goodreads, Open Library, …), for
# imports and sync. Active books only.
query FindBookMappings($platformId: Int!, $externalIds: [String!]!) {
  book_mappings(
    where: {
      platform_id: { _eq: $platformId }
      external_id: { _in: $externalIds }
      book: { book_status_id: { _eq: 1 } }
    }
    order_by: { id: asc }
  ) {
    external_id
    edition_id
    book {
      ...BookSummary
    }
  }
}
