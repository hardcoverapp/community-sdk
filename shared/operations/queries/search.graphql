# One operation for every query_type. `results` is raw Typesense JSON whose
# shape depends on query_type; SDKs decode it per type
# (spec/03-sdk-design.md#search). Only one `search` per request is allowed.
query Search(
  $query: String!
  $queryType: String = "book"
  $page: Int = 1
  $perPage: Int = 25
  $fields: String
  $weights: String
  $typos: String
  $sort: String
  $filterBy: String
) {
  search(
    query: $query
    query_type: $queryType
    page: $page
    per_page: $perPage
    fields: $fields
    weights: $weights
    typos: $typos
    sort: $sort
    filter_by: $filterBy
  ) {
    ids
    results
    query
    query_type
    page
    per_page
    error
  }
}
