query GetVibesForUser($userId: Int!, $limit: Int = 25, $offset: Int = 0) {
  vibes(where: { user_id: { _eq: $userId } }, order_by: { updated_at: desc }, limit: $limit, offset: $offset) {
    ...VibeSummary
  }
}

query GetVibe($id: Int!) {
  vibes_by_pk(id: $id) {
    ...VibeSummary
  }
}

# Ranked book ids, generated by the site when the vibe is viewed (not by the
# API yet); books_generated_at vs updated_at tells whether they're current.
query GetVibeBookIds($id: Int!) {
  vibes_by_pk(id: $id) {
    id
    updated_at
    books_generated_at
    cached_book_ids
  }
}
