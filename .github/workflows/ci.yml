# Dormant until GitHub Actions is enabled for the repo. Mirrors the local
# checks: every language-independent check, then the TypeScript package. Live
# API tests are never run here implicitly (spec/04); they'd be a separate,
# manually triggered workflow with environment-scoped secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shared:
    name: Shared contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:operations
      - run: pnpm matrix:check

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen:check
      - run: pnpm typecheck
      - run: pnpm test
      # Syntax check with the current Hermes compiler (runtime checks need HERMES_BIN).
      - run: pnpm hermes:smoke
